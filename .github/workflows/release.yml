name: 🚀 Auto Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v3

      # Python 3.11 和 node-gyp 有兼容问题, 导致无法安装依赖
      # https://github.com/slint-ui/slint/commit/a9c48e33502fdebc36c5aa2f4f516c2218424679#diff-944291df2c9c06359d37cc8833d182d705c9e8c3108e7cfe132d61a06e9133dd
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 发布开始通知
      - name: Release start ding talk dev group notify
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          ignoreError: true
          body: |
            {
              "msgtype": "link",
              "link": {
                "title": "🚀 开始自动发布 🚀",
                "text": "🔗 请点击链接查看详情",
                "messageUrl": "https://github.com/antvis/G/actions/workflows/release.yml",
                "picUrl": "https://gw.alipayobjects.com/zos/antfincdn/9Ivxcn0hFl/Gtoutu.png"
              }
            }

      - name: Build
        run: pnpm build

      # 自动发布完成后 触发 github.release.published 事件
      # 如果是 action 自带的 机器人 token, 出于安全考虑, github 会禁止循环触发, 使用真实用户的 token 可解决这个问题
      #
      # 双模式发布:
      # Step 1: OIDC 可信发布 — 已配置 Trusted Publisher 的包（如 @antv/g-lite）通过 OIDC 获取短期令牌
      #         失败的包（未配置 Trusted Publisher）会被跳过，不影响后续步骤
      # Step 2: NPM_TOKEN 发布 — 未配置 Trusted Publisher 的包用长期令牌兜底发布
      #         changeset publish 会自动跳过 Step 1 已发布的包

      - name: Release (OIDC Trusted Publishing)
        env:
          GITHUB_TOKEN: ${{ secrets.CD_GITHUB_TOKEN }}
          npm_config_legacy_peer_deps: true
        run: pnpm release
        continue-on-error: true

      - name: Release (NPM_TOKEN fallback)
        env:
          GITHUB_TOKEN: ${{ secrets.CD_GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_legacy_peer_deps: true
        run: pnpm release

      # 校验所有变更包是否都已发布到 npm registry
      - name: Verify all packages published
        run: |
          set -e
          FAILED=false
          for pkg_dir in packages/*/; do
            pkg_name=$(node -p "require('./${pkg_dir}package.json').name" 2>/dev/null)
            pkg_version=$(node -p "require('./${pkg_dir}package.json').version" 2>/dev/null)
            if [ -z "$pkg_name" ] || [ -z "$pkg_version" ]; then
              continue
            fi
            # 跳过 private 包
            is_private=$(node -p "require('./${pkg_dir}package.json').private || false" 2>/dev/null)
            if [ "$is_private" = "true" ]; then
              continue
            fi
            # 检查 npm registry 上是否存在该版本
            if ! npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "::error::${pkg_name}@${pkg_version} not found on npm registry"
              FAILED=true
            else
              echo "OK: ${pkg_name}@${pkg_version}"
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "::error::Some packages failed to publish"
            exit 1
          fi

      # 发布失败通知内部开发群
      - name: Release failed ding talk dev group notify
        if: ${{ failure() }}
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          ignoreError: true
          body: |
            {
              "msgtype": "link",
              "link": {
                "title": "🚨 自动发布失败 🚨",
                "text": "🔗 请点击链接查看具体原因, 及时修复, 尝试点击右上角 [Re-run all jobs] 重试, 或手动发布 🚑",
                "messageUrl": "https://github.com/antvis/G/actions/workflows/release.yml",
                "picUrl": "https://gw.alipayobjects.com/zos/antfincdn/9Ivxcn0hFl/Gtoutu.png"
              }
            }
